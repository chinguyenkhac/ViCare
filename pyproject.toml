[project]
name = "vicare-safe"
version = "0.3.0"
description = "RAG hỗ trợ tra cứu sức khỏe tiếng Việt: hiểu tiếng Việt không dấu, có độ tin cậy và bằng chứng"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "datasets>=3,<5", "sentence-transformers>=4,<6", "torch>=2.2"]

[project.optional-dependencies]
app = ["gradio>=5,<7"]
dev = ["pytest>=8", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools]
packages = ["vicare_safe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
